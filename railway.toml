# Railway Container Worker Configuration for BakuEstate-AI v2
# Runs 2+ stateless worker replicas with graceful SIGTERM draining so running FFmpeg
# renders terminate cleanly and release leases back to `pipeline_jobs`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
numReplicas = 2
startCommand = "python -m src.worker.local_worker --no-scheduler"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 60
overlapSeconds = 0
